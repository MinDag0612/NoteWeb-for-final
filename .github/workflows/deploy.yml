name: Swarm Deploy

on:
  push:
      branches:
        - main
        - Test/cicd-test
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: "[INFO - General] Checkout"
        uses: actions/checkout@v4

      - name: "[INFO - Stack] Copy stack file"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}

          source: "docker-stack.yml"
          target: "/home/ubuntu/deploy"

      - name: "[INFO - Stack] Deploy Swarm"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd /home/ubuntu/deploy

            export IMAGE_TAG=${{ github.sha }}

            docker stack deploy \
              --with-registry-auth \
              -c docker-stack.yml \
              app