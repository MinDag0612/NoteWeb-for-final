version: "3.9"

services:

  backend:
    image: dangwminh/backend:${IMAGE_TAG}

    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CLOUDY_NAME: ${CLOUDY_NAME}
      CLOUDY_API_KEY: ${CLOUDY_API_KEY}
      CLOUDY_SECRET: ${CLOUDY_SECRET}
      GG_CLIENT_ID: ${GG_CLIENT_ID}

    networks:
      app-network:
        aliases:
          - backend

    deploy:
      replicas: 3

      update_config:
        parallelism: 1
        order: start-first

  frontend:
    image: dangwminh/frontend:${IMAGE_TAG}

    networks:
      app-network:
        aliases:
          - frontend

    deploy:
      replicas: 2

      update_config:
        parallelism: 1
        order: start-first

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

    networks:
      app-network:
        aliases:
          - nginx

    deploy:
      replicas: 1

  mongo:
    image: mongo:7

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

    volumes:
      - mongo_data:/data/db

    networks:
      app-network:
        aliases:
          - mongo

    deploy:
      replicas: 1

networks:
  app-network:
    external: true
    name: noteweb-net

volumes:
  mongo_data:

configs:
  nginx_config:
    name: nginx_config_${IMAGE_TAG}
    file: ./nginx.conf
