name: Deploy Monitoring

on:
  workflow_call:        # ← cho phép file khác gọi file này
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get instance ID
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=swarm-manager" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Get public IP
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "SERVER_HOST=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Wait SSH
        run: |
          for i in {1..30}; do
            nc -z $SERVER_HOST 22 && echo "SSH ready" && break
            sleep 5
          done

      - name: Prepare monitoring folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p /home/ubuntu/deploy/monitoring

      - name: Copy monitoring files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "monitoring/"
          target: "/home/ubuntu/deploy"

      - name: Deploy monitoring stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: GRAFANA_PASSWORD
          script: |
            cd /home/ubuntu/deploy/monitoring
            docker stack rm monitoring 2>/dev/null || true
            sleep 10
            docker stack deploy -c monitoring-stack.yml monitoring

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            sleep 20
            docker stack services monitoring