- hosts: all
  become: yes

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

# =========================
# SWARM INIT (MANAGER ONLY)
# =========================
- hosts: manager
  become: yes
  tasks:
    - name: Init swarm
      shell: docker swarm init
      ignore_errors: yes

    - name: Get worker token
      shell: docker swarm join-token worker -q
      register: worker_token

    - name: Save token
      set_fact:
        swarm_token: "{{ worker_token.stdout }}"

# =========================
# WORKERS JOIN SWARM
# =========================
- hosts: workers
  become: yes
  tasks:
    - name: Join swarm
      shell: >
        docker swarm join
        --token {{ hostvars[groups['manager'][0]].swarm_token }}
        {{ hostvars[groups['manager'][0]].ansible_host | default(groups['manager'][0]) }}:2377