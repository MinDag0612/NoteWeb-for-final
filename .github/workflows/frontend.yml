name: Frontend CD

on:
  push:
      branches:
        - main
        - Test/cicd-test
  workflow_dispatch:

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:

      - name: "[INFO - General] Checkout"
        uses: actions/checkout@v4

      - name: "[INFO - General] Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: "[INFO - Frontend] Build frontend"
        run: |
          docker build \
            -f frontend/dockerfile \
            -t dangwminh/frontend:${{ github.sha }} \
            ./frontend

      - name: "[INFO - Frontend] Push frontend"
        run: |
          docker push dangwminh/frontend:${{ github.sha }}
