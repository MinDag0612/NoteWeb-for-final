name: CD Pipeline

# file này sẽ ko build image nữa mà chỉ dùng để deploy lên ec2

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get instance ID
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=swarm-manager" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Check instance state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "STATE=$STATE"
          echo "STATE=$STATE" >> $GITHUB_ENV

      - name: Start instance if stopped
        if: env.STATE == 'stopped'
        run: |
          aws ec2 start-instances --instance-ids $INSTANCE_ID

      - name: Wait instance running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          if [ "$STATE" = "terminated" ]; then
            echo "Instance terminated → stop pipeline"
            exit 1
          fi
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID

      - name: Get public IP
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "SERVER_HOST=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Wait SSH
        run: |
          for i in {1..30}; do
            nc -z $SERVER_HOST 22 && echo "SSH ready" && break
            sleep 5
          done

      - name: Prepare deploy folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p /home/ubuntu/deploy

      - name: Debug files
        run: |
          pwd
          ls -la

      - name: Copy stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: |
            docker-stack.yml
            nginx.conf
          target: "/home/ubuntu/deploy"

      - name: Deploy Swarm
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CLOUDY_NAME: ${{ secrets.CLOUDY_NAME }}
          CLOUDY_API_KEY: ${{ secrets.CLOUDY_API_KEY }}
          CLOUDY_SECRET: ${{ secrets.CLOUDY_SECRET }}
          GG_CLIENT_ID: ${{ secrets.GG_CLIENT_ID }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,MONGODB_URI,JWT_SECRET_KEY,CLOUDY_NAME,CLOUDY_API_KEY,CLOUDY_SECRET,GG_CLIENT_ID
          script: |
            cd /home/ubuntu/deploy

            docker network inspect noteweb-net >/dev/null 2>&1 || \
              docker network create --driver overlay --attachable noteweb-net

            # Lưu tag đang chạy trước khi deploy
            CURRENT_TAG=$(docker service inspect app_backend \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null \
              | cut -d: -f2 || echo "none")
            echo "Current tag: $CURRENT_TAG"

            # Deploy version mới
            docker stack deploy \
              --with-registry-auth \
              -c docker-stack.yml \
              app

            # Chờ và kiểm tra services healthy
            echo "Waiting for services to converge..."
            TIMEOUT=120
            ELAPSED=0
            FAILED=false

            while [ $ELAPSED -lt $TIMEOUT ]; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))

              # Đếm replicas đang running
              BACKEND_RUNNING=$(docker service ps app_backend \
                --filter "desired-state=running" \
                --format "{{.CurrentState}}" \
                | grep -c "Running" || true)

              FRONTEND_RUNNING=$(docker service ps app_frontend \
                --filter "desired-state=running" \
                --format "{{.CurrentState}}" \
                | grep -c "Running" || true)

              # Đếm replicas bị fail
              BACKEND_FAILED=$(docker service ps app_backend \
                --filter "desired-state=shutdown" \
                --format "{{.Error}}" \
                | grep -c "non-zero exit" || true)

              echo "Backend running: $BACKEND_RUNNING, failed: $BACKEND_FAILED"
              echo "Frontend running: $FRONTEND_RUNNING"

              # Nếu có replica fail → rollback
              if [ "$BACKEND_FAILED" -gt "2" ]; then
                echo "Too many failures detected, rolling back..."
                FAILED=true
                break
              fi

              # Nếu đủ replicas running → success
              if [ "$BACKEND_RUNNING" -ge "3" ] && [ "$FRONTEND_RUNNING" -ge "2" ]; then
                echo "Deploy successful!"
                break
              fi
            done

            # Rollback nếu fail
            if [ "$FAILED" = "true" ]; then
              echo "=== ROLLING BACK to $CURRENT_TAG ==="
              export IMAGE_TAG=$CURRENT_TAG
              docker stack deploy \
                --with-registry-auth \
                -c docker-stack.yml \
                app
              echo "Rollback complete"
              exit 1
            fi

            # Seed data
            docker run --rm \
              --network noteweb-net \
              -e MONGODB_URI="$MONGODB_URI" \
              -e SEED_DROP=false \
              dangwminh/backend:$IMAGE_TAG \
              python seed.py