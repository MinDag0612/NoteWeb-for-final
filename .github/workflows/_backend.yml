name: Backend CI Reusable

on:
  workflow_call:
    inputs:
      python_version:
        required: true
        type: string
      artifact_retention_days:
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check backend tests

      - name: Test backend
        run: python -m pytest

      - name: Build backend wheel artifact
        run: |
          mkdir -p artifacts/backend-dist
          python -m build --wheel --no-isolation --outdir artifacts/backend-dist

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: artifacts/backend-dist
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summarize backend evidence
        run: |
          {
            echo "### Backend CI Evidence"
            echo "- Artifact: \`backend-build\`"
            echo "- Type: Python wheel package built from the FastAPI backend source"
            echo "- Purpose: reproducible backend application artifact for report, audit, and CI evidence"
          } >> "${GITHUB_STEP_SUMMARY}"
