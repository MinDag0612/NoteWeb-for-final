name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.10"
  ARTIFACT_RETENTION_DAYS: "14"

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test:ci -- --runInBand

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Summarize frontend evidence
        run: |
          {
            echo "### Frontend CI Evidence"
            echo "- Artifact: \`frontend-build\`"
            echo "- Purpose: reproducible frontend build output for report, demo, and future CD handoff"
          } >> "${GITHUB_STEP_SUMMARY}"

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check backend tests

      - name: Test backend
        run: python -m pytest

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trivy filesystem report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs-report.json
          exit-code: "0"

      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Enforce Trivy severity gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Summarize repository security evidence
        if: always()
        run: |
          {
            echo "### Repository Security Evidence"
            echo "- Artifact: \`trivy-fs-report\`"
            echo "- Scan scope: filesystem source tree"
            echo "- Gate: blocks \`HIGH\` and \`CRITICAL\` findings after scoped risk acceptance is applied"
          } >> "${GITHUB_STEP_SUMMARY}"

  docker-images:
    name: Docker Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - security-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: nguyenhongphu1/noteweb-frontend
            dockerfile: ./frontend/dockerfile
          - service: backend
            image: nguyenhongphu1/noteweb-backend
            dockerfile: ./backend/dockerfile
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive immutable image tags
        id: image-vars
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            source_branch="${GITHUB_HEAD_REF}"
          else
            source_branch="${GITHUB_REF_NAME}"
          fi

          branch_slug="$(echo "${source_branch}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "branch_slug=${branch_slug}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${{ matrix.image }}:sha-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "branch_tag=${{ matrix.image }}:branch-${branch_slug}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ steps.image-vars.outputs.sha_tag }}
            ${{ steps.image-vars.outputs.branch_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Prepare evidence workspace
        run: mkdir -p artifacts

      - name: Record ${{ matrix.service }} image metadata
        run: |
          cat > "artifacts/${{ matrix.service }}-image-metadata.json" <<EOF
          {
            "service": "${{ matrix.service }}",
            "image_repository": "${{ matrix.image }}",
            "immutable_tag": "${{ steps.image-vars.outputs.sha_tag }}",
            "traceability_tag": "${{ steps.image-vars.outputs.branch_tag }}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "event_name": "${{ github.event_name }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}"
          }
          EOF

      - name: Generate Trivy ${{ matrix.service }} image report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-vars.outputs.sha_tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: artifacts/${{ matrix.service }}-trivy-image-report.json
          exit-code: "0"

      - name: Generate CycloneDX SBOM for ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-vars.outputs.sha_tag }}
          format: cyclonedx
          output: artifacts/${{ matrix.service }}-sbom.cdx.json
          exit-code: "0"

      - name: Upload ${{ matrix.service }} image evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.service }}
          path: |
            artifacts/${{ matrix.service }}-image-metadata.json
            artifacts/${{ matrix.service }}-trivy-image-report.json
            artifacts/${{ matrix.service }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-vars.outputs.sha_tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Summarize ${{ matrix.service }} image evidence
        if: always()
        run: |
          {
            echo "### ${{ matrix.service }} Image Evidence"
            echo "- Immutable deployment tag: \`${{ steps.image-vars.outputs.sha_tag }}\`"
            echo "- Traceability tag: \`${{ steps.image-vars.outputs.branch_tag }}\`"
            echo "- Artifact: \`image-evidence-${{ matrix.service }}\`"
            echo "- Contents: Trivy JSON report, CycloneDX SBOM, deployment metadata JSON"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Push ${{ matrix.service }} image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker image push "${{ steps.image-vars.outputs.sha_tag }}"
          docker image push "${{ steps.image-vars.outputs.branch_tag }}"
