name: Deploy

on:
  push:
    branches:
      - main
      - Test/cicd-test
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Check Docker Login
        run: docker info

      - name: Build backend
        run: |
          docker build \
            -t dangwminh/backend:${{ github.sha }} \
            ./backend

      - name: Push backend
        run: |
          docker push dangwminh/backend:${{ github.sha }}

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd app

            export IMAGE_TAG=${{ github.sha }}

            docker stack deploy \
              -c docker-stack.yml \
              app