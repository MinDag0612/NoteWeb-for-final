# =================================================================
# MỤC ĐÍCH: Trạm trung chuyển dữ liệu giám sát (Metrics/Traces).
# Giúp tách biệt logic ứng dụng khỏi hạ tầng (Local vs Cloud).
# =================================================================

receivers:
  otlp:
    protocols:
      grpc: # Nhận dữ liệu từ Backend (FastAPI) qua cổng 4317
      http: # Nhận dữ liệu qua REST API nếu cần

processors:
  batch: # Gom dữ liệu gửi đi theo đợt để tối ưu hiệu năng và băng thông

exporters:
  # CỔNG RA 1: Xuất dữ liệu ra định dạng Prometheus để Grafana truy vấn (Local)
  prometheus:
    endpoint: "0.0.0.0:8889"
  
  # CỔNG RA 2: Xem log trực tiếp tại terminal (Dùng để debug)
  debug:
    verbosity: normal

  # CỔNG RA 3 (PRODUCTION): Khi lên AWS, sẽ cấu hình thêm tại đây
  # aws_prom_remotewrite: 
  #   endpoint: "https://aps-workspaces.us-east-1.amazonaws.com/..."

service:
  pipelines:
    metrics:
      receivers: [otlp]      # Nhận từ App
      processors: [batch]     # Xử lý tập trung
      exporters: [prometheus, debug] # Đẩy ra hệ thống lưu trữ